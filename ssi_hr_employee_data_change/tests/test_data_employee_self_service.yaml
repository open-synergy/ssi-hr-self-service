        values:
          name: "EDC Employee c2"
          user_id: "REC: employee_user.id"
          address_home_id: "REC: partner.id"

      - step: "Create the request of the employee"
        action: "create"
        model: "employee_data_change_request"
        save_as: "request"
        values:
          employee_id: "REC: employee.id"
          new_identification_id: "CAN-c2"

      - step: "Create another employee"
        action: "create"
        model: "hr.employee"
        save_as: "other_employee"
        values:
          name: "EDC Other Employee c2"

      - step: "Create the request of the other employee"
        action: "create"
        model: "employee_data_change_request"
        save_as: "other_request"
        values:
          employee_id: "REC: other_employee.id"
          new_identification_id: "OTHER-c2"

      - step: "Cancelling the request of another employee is refused"
        action: "call"
        target: "request"
        method: "self_service_cancel_request"
        as_user: "service_user"
        args:
          - "REC: employee_user.id"
          - "REC: other_request.id"
        expect_error:
          type: "AccessError"

      - step: "The request of the other employee is untouched"
        action: "assert"
        target: "other_request"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "draft"

