            - [4, "REF: ssi_hr_employee_data_change.group_employee_self_service_api"]

      - step: "Create the user of the employee"
        action: "create"
        model: "res.users"
        save_as: "employee_user"
        values:
          name: "EDC Employee User w2"
          login: "edc_employee_w2"

      - step: "Create the private address partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "EDC Private Address w2"
          type: "private"

      - step: "Create the employee of the user"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "EDC Employee w2"
          user_id: "REC: employee_user.id"
          address_home_id: "REC: partner.id"

      - step: "Create a request that hosts the model method"
        action: "create"
        model: "employee_data_change_request"
        save_as: "request"
        values:
          employee_id: "REC: employee.id"
          new_identification_id: "HOST-w2"

      - step: "Writing the work phone is refused"
        action: "call"
        target: "request"
        method: "self_service_write_contact"
        as_user: "service_user"
        args:
          - "REC: employee_user.id"
          - street: "Must Not Persist"
            work_phone: "02199999"
        expect_error:
          type: "ValidationError"
          message_contains: "work_phone"

      - step: "Nothing was written to the partner"
        action: "assert"
        target: "partner"
        refresh: true
        asserts:
          street:
            type: "value"
            operator: "is_falsy"

