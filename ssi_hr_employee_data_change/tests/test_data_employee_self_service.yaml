  - name: "Employee Self-Service - Cancel a confirmed request as the employee"
    steps:
      - step: "Create the service account"
        action: "create"
        model: "res.users"
        save_as: "service_user"
        values:
          name: "EDC Service c1"
          login: "edc_service_c1"
          groups_id:
            - [4, "REF: ssi_hr_employee_data_change.group_employee_self_service_api"]

      - step: "Create the user of the employee"
        action: "create"
        model: "res.users"
        save_as: "employee_user"
        values:
          name: "EDC Employee User c1"
          login: "edc_employee_c1"

      - step: "Create the private address partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "EDC Private Address c1"
          type: "private"

      - step: "Create the employee of the user"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "EDC Employee c1"
          user_id: "REC: employee_user.id"
          address_home_id: "REC: partner.id"

      - step: "Create the request of the employee"
        action: "create"
        model: "employee_data_change_request"
        save_as: "request"
        values:
          employee_id: "REC: employee.id"
          new_identification_id: "CAN-c1"

      - step: "Confirm the request"
        action: "call"
        target: "request"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true

      - step: "Request waits for approval"
        action: "assert"
        target: "request"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Cancel the request as the service account"
        action: "call"
        target: "request"
        method: "self_service_cancel_request"
        as_user: "service_user"
        args:
          - "REC: employee_user.id"
          - "REC: request.id"

      - step: "The request is cancelled by the employee"
        action: "assert"
        target: "request"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "cancel"
          write_uid:
            type: "m2o"
            expected: "REC: employee_user"

  - name: "Employee Self-Service - A request of another employee cannot be cancelled"
    steps:
      - step: "Create the service account"
        action: "create"
        model: "res.users"
        save_as: "service_user"
        values:
          name: "EDC Service c2"
          login: "edc_service_c2"
          groups_id:
            - [4, "REF: ssi_hr_employee_data_change.group_employee_self_service_api"]

      - step: "Create the user of the employee"
        action: "create"
        model: "res.users"
        save_as: "employee_user"
        values:
          name: "EDC Employee User c2"
          login: "edc_employee_c2"

      - step: "Create the private address partner"
